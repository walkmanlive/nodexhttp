name: 构建并推送镜像到 GHCR

# 触发条件：推送到 dev 分支时自动构建，也支持手动触发
on:
  push:
    branches: [ "dev" ]
    paths:
      - 'hugging-face/**'  # 只有 hugging-face 目录文件变动才触发
  workflow_dispatch:      # 允许在 Actions 页面手动点击运行

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nodexh  # 镜像名称

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # 必须开启，否则无法推送到 GHCR

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 设置 Docker Buildx 加速构建
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR 容器仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动生成，无需手动添加

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./hugging-face       # 关键：构建上下文指向子目录
          file: ./hugging-face/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha          # 开启构建缓存，大幅提升二次构建速度
          cache-to: type=gha,mode=max
